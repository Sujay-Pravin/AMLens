<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMLens — AML Investigation</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fafafa; }
  h1 { margin-bottom: 0.25rem; }
  .subtitle { color: #666; margin-top: 0; }
  .upload-bar { display: flex; gap: 0.5rem; align-items: center; margin: 1.5rem 0; }
  button { padding: 0.5rem 1rem; cursor: pointer; border: 1px solid #333; background: #1a1a1a; color: white; border-radius: 4px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card h2 { margin-top: 0; font-size: 1.1rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
  .badge.Low { background: #dcf5e0; color: #1a7431; }
  .badge.Medium { background: #fff3cd; color: #8a6100; }
  .badge.High { background: #ffe0cc; color: #a1440c; }
  .badge.Critical { background: #ffd6d6; color: #a10c0c; }
  .report { white-space: pre-wrap; line-height: 1.5; }
  #status { color: #666; margin-left: 0.5rem; }
  .error { color: #a10c0c; }
  .trace-yes { color: #1a7431; font-weight: 600; }
  .trace-no { color: #999; }
</style>
</head>
<body>

<h1>AMLens — AML Investigation</h1>
<p class="subtitle">Upload a transaction CSV to run the analytics pipeline (validation, rules, ML + SHAP, risk fusion, graph analytics) and generate an AI investigation report.</p>

<div class="upload-bar">
  <input type="file" id="fileInput" accept=".csv">
  <input type="text" id="queryInput" placeholder='e.g. "Find structuring patterns in the last 30 days" or "Is customer 4521 suspicious?"' style="flex: 1; padding: 0.5rem;">
  <button id="runBtn">Run Investigation</button>
  <span id="status"></span>
</div>

<div id="results"></div>

<script>
const fileInput = document.getElementById('fileInput');
const queryInput = document.getElementById('queryInput');
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const results = document.getElementById('results');

function badge(level) {
  return `<span class="badge ${level}">${level}</span>`;
}

function renderList(items) {
  if (!items || items.length === 0) return '<em>none</em>';
  return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
}

function renderTable(rows, columns) {
  const head = columns.map(c => `<th>${c}</th>`).join('');
  const body = rows.map(r => '<tr>' + columns.map(c => `<td>${r[c]}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const TOOL_LABELS = {
  validation: 'Validation',
  eda: 'EDA',
  rules: 'Rule Engine',
  ml: 'ML',
  fusion: 'Risk Fusion',
  graph: 'Graph',
};

function renderTrace(trace) {
  return Object.entries(trace || {}).map(([tool, ran]) => {
    const mark = ran ? '✓' : '✗';
    const cls = ran ? 'trace-yes' : 'trace-no';
    return `<span class="${cls}">${mark} ${TOOL_LABELS[tool] || tool}</span>`;
  }).join('&nbsp;&nbsp;');
}

function render(data) {
  const topTxRows = (data.top_transactions || []).map(t => ({
    ...t,
    risk_score: t.risk_score.toFixed(3),
    fraud_probability: (t.fraud_probability * 100).toFixed(2) + '%',
    triggered_rules: t.triggered_rules.join(', ') || 'none',
  }));

  results.innerHTML = `
    <div class="card">
      <h2>Query</h2>
      <p><b>File:</b> ${data.filename}</p>
      <p><b>Query:</b> ${data.query || '<em>none</em>'}</p>
      <p><b>Parsed intent:</b> ${data.parsed_intent.intent || 'unknown'} ${data.parsed_intent.aml_pattern ? '(' + data.parsed_intent.aml_pattern + ')' : ''}</p>
      <p><b>Filters applied:</b> ${Object.keys(data.filters_applied).length ? JSON.stringify(data.filters_applied) : 'none'}</p>
    </div>

    <div class="card">
      <h2>Execution Plan</h2>
      <p>${renderTrace(data.execution_trace)}</p>
    </div>

    <div class="card">
      <h2>Validation Summary</h2>
      <p><b>Rows:</b> ${data.validation.total_rows} &nbsp; <b>Columns:</b> ${data.validation.total_columns} &nbsp;
         <b>Duplicates removed:</b> ${data.validation.duplicate_rows}</p>
      <p><b>Missing columns:</b> ${data.validation.missing_columns.length ? data.validation.missing_columns.join(', ') : 'none'}</p>
    </div>

    ${data.eda ? `
    <div class="card">
      <h2>EDA Summary</h2>
      <p><b>Rows analyzed:</b> ${data.eda.summary.rows} &nbsp; <b>Columns:</b> ${data.eda.summary.columns}</p>
      <p><b>Class distribution (is_laundering):</b> ${JSON.stringify(data.eda.class_distribution)}</p>
    </div>` : ''}

    ${data.top_transactions && data.top_transactions.length ? `
    <div class="card">
      <h2>Top Suspicious Transactions (${data.top_transactions.length})</h2>
      ${renderTable(topTxRows, ['row_index', 'sender_entity_id', 'receiver_entity_id', 'amount_paid', 'risk_level', 'risk_score', 'fraud_probability', 'triggered_rules', 'explanation'])}
    </div>` : ''}

    ${data.graph ? `
    <div class="card">
      <h2>Graph Metrics</h2>
      <p><b>Accounts:</b> ${data.graph.node_count} &nbsp; <b>Transfers:</b> ${data.graph.edge_count} &nbsp;
         <b>Connected clusters:</b> ${data.graph.num_components} &nbsp; <b>Cycles found:</b> ${data.graph.cycles.length}</p>
      <p><b>Hub accounts:</b> ${renderList(data.graph.hub_accounts)}</p>
      <p><b>Suspected mule accounts:</b> ${renderList(data.graph.mule_accounts)}</p>
    </div>` : ''}

    <div class="card">
      <h2>Final AI Investigation Report</h2>
      <p class="report">${data.investigation_report}</p>
      <p><b>Recommendation:</b> ${data.recommendation}</p>
    </div>
  `;
}

runBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) {
    statusEl.textContent = 'Please choose a CSV file first.';
    statusEl.className = 'error';
    return;
  }

  statusEl.className = '';
  statusEl.textContent = 'Running investigation...';
  runBtn.disabled = true;
  results.innerHTML = '';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('query', queryInput.value.trim());

  try {
    const res = await fetch('/investigate', { method: 'POST', body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `Request failed with status ${res.status}`);
    }
    const data = await res.json();
    render(data);
    statusEl.textContent = 'Done.';
  } catch (e) {
    statusEl.className = 'error';
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    runBtn.disabled = false;
  }
});
</script>

</body>
</html>
